apiVersion: v1
kind: Service
metadata:
  name: {{ include "protected.basename" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "protected.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # clusterIP: None
  ports:
    - name: http
      port: 8003
      protocol: TCP
      targetPort: 8003
  selector: {{- include "protected.matchLabels" . | nindent 4 }}