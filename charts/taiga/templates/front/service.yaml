apiVersion: v1
kind: Service
metadata:
  name: {{ include "front.basename" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "front.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # clusterIP: None
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
  selector: {{- include "front.matchLabels" . | nindent 4 }}