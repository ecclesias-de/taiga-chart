apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "gateway.basename" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.deployment.replicas }}
  selector:
    matchLabels: {{- include "gateway.matchLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "gateway.labels" . | nindent 8 }}
    spec:
      serviceAccount: {{ .Values.serviceAccount }}

      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 2000

      containers:
      - name: gateway

        image: {{ .Values.gateway.deployment.image.repository }}:{{ .Values.gateway.deployment.image.tag }}
        imagePullPolicy: {{ .Values.gateway.deployment.image.imagePullPolicy }}

        {{- if .Values.debug.diagnoseMode.gateway.enabled }}
        command: {{- toYaml .Values.debug.diagnoseMode.gateway.command  | nindent 12 }}
        {{- else }}
        # command:
        #   - bash
        #   - /entrypoint.sh
        {{- end}}

        {{- if .Values.gateway.deployment.resources }}
        resources: {{- toYaml .Values.gateway.deployment.resources | nindent 12 }}
        {{- end }}

        securityContext:
          allowPrivilegeEscalation: false

        readinessProbe:
          httpGet:
            path: /conf.json
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /conf.json
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

        volumeMounts:
        - name: data
          subPath: static
          mountPath: /taiga/static
        - name: data
          subPath: media
          mountPath: /taiga/media
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true

      volumes:
      - name: data
        persistentVolumeClaim:
            claimName: {{ template "pvc" . }}
      - name: config
        configMap:
          name: {{ template "gateway.basename" . }}