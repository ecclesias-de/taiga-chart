async:
  deployment:
    replicas: 2
    resources:
      requests:
        memory: 300Mi
        cpu: 50m
      limits:
        memory: 300Mi

backend:
  deployment:
    image:
      repository: taigaio/taiga-back
      imagePullPolicy: IfNotPresent
    replicas: 4
    resources:
      requests:
        memory: 200Mi
        cpu: 50m
      limits:
        memory: 200Mi
  hooks:
    migrate:
      enabled: true
      resources:
        requests:
          memory: 1Gi
          cpu: 1
        limits:
          memory: 1Gi
    
events:
  deployment:
    image:
      repository: taigaio/taiga-events
      tag: 6.7.0
      imagePullPolicy: IfNotPresent
    replicas: 2
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 100Mi
    
front:
  deployment:
    image:
      repository: taigaio/taiga-front
      imagePullPolicy: IfNotPresent
      tag: 6.8.2
    replicas: 2
    resources:
      requests:
        memory: 50Mi
        cpu: 50m
      limits:
        memory: 50Mi
    
protected:
  deployment:
    image:
      repository: taigaio/taiga-protected
      imagePullPolicy: IfNotPresent
      tag: 6.8.1
    replicas: 2
    resources:
    resources:
      requests:
        memory: 200Mi
        cpu: 10m
      limits:
        memory: 200Mi

gateway:
  deployment:
    image:
      repository: nginxinc/nginx-unprivileged
      tag: 1.29.0-bookworm
      imagePullPolicy: IfNotPresent
    replicas: 2
    resources:
      requests:
        memory: 50Mi
        cpu: 50m
      limits:
        memory: 50Mi

serviceAccount: default

jobAnnotations:

rabbitmq:
  events:
    hostname: #REQUIRED
    port: 5672
    username: #REQUIRED
    password: #REQUIRED
    vhost: events
  async:
    hostname: #REQUIRED
    port: 5672
    username: #REQUIRED
    password: #REQUIRED
    vhost: async

database:
  host: #REQUIRED
  db: #REQUIRED
  user: #REQUIRED
  password: #REQUIRED
  userSecret:
  connectionConfigMap: 
  sslmode: require

ingress:
  enabled: true
  hostname: #REQUIRED
  annotations: 
    kubernetes.io/tls-acme: "true"

secrets:
  existingSecret:
  TAIGA_SECRET_KEY: #REQUIRED
  TAIGA_SITES_SCHEME: https
  WEBSOCKETS_SCHEME: wss
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  DEFAULT_FROM_EMAIL: #REQUIRED
  EMAIL_USE_TLS: true
  EMAIL_USE_SSL: false
  EMAIL_HOST: #REQUIRED
  EMAIL_PORT: #REQUIRED
  EMAIL_HOST_USER: #REQUIRED
  EMAIL_HOST_PASSWORD: #REQUIRED
  ENABLE_TELEMETRY: false
  ATTACHMENTS_MAX_AGE: 360

persistence:
  accessMode: ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  storageClassName:
  existingPvc:

metadata:
  team:
  name:

debug:
  diagnoseMode:
    async:
      enabled: false
      command: [tail, -f, /dev/null]
    backend:
      enabled: false
      command: [tail, -f, /dev/null]
    backendmigrate:
      enabled: false
      command: [tail, -f, /dev/null]
    front:
      enabled: false
      command: [tail, -f, /dev/null]
    events:
      enabled: false
      command: [tail, -f, /dev/null]
    protected:
      enabled: false
      command: [tail, -f, /dev/null]
    gateway:
      enabled: false
      command: [tail, -f, /dev/null]